<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaber Group — لوحة الفرز والتقييم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#09090B',
                        surface: 'rgba(24, 24, 27, 0.7)',
                        amber: { 400: '#FBBF24', 500: '#F59E0B', 600: '#D97706', 700: '#B45309' },
                        glass: 'rgba(24, 24, 27, 0.55)',
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        ibm: ['IBM Plex Sans Arabic', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* ===== القاعدة الأساسية ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            background-color: #09090B;
            color: #e4e4e7;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        h1, h2, h3, h4, h5, h6, .font-heading { font-family: 'Cairo', sans-serif; }

        /* ===== الشبكة المعمارية الخلفية ===== */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(245, 158, 11, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(245, 158, 11, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        /* ===== تأثير إضاءة المؤشر ===== */
        #cursor-glow {
            position: fixed;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.07) 0%, transparent 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            transition: opacity 0.3s;
        }

        /* ===== أسطح الزجاج ===== */
        .glass {
            background: rgba(24, 24, 27, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(245, 158, 11, 0.1);
        }
        .glass-strong {
            background: rgba(24, 24, 27, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(245, 158, 11, 0.15);
        }

        /* ===== تأثير الاهتزاز ===== */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-12px); }
            40% { transform: translateX(12px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }
        .shake { animation: shake 0.5s ease-in-out; }

        /* ===== تأثير النبض ===== */
        @keyframes pulse-amber {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.3); }
            50% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); }
        }
        .pulse-amber { animation: pulse-amber 2s infinite; }

        /* ===== ادخال PIN ===== */
        .pin-input {
            width: 56px; height: 64px;
            text-align: center; font-size: 1.75rem; font-weight: 700;
            background: rgba(24, 24, 27, 0.8);
            border: 2px solid rgba(245, 158, 11, 0.25);
            border-radius: 12px; color: #F59E0B;
            outline: none; caret-color: transparent;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-family: 'Cairo', sans-serif;
        }
        .pin-input:focus {
            border-color: #F59E0B;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
        }

        /* ===== بطاقات KPI ===== */
        .kpi-card {
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .kpi-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(245, 158, 11, 0.1);
        }

        /* ===== بطاقات المتقدمين ===== */
        .applicant-card {
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
        }
        .applicant-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
            border-color: rgba(245, 158, 11, 0.3);
        }

        /* ===== لوحة الفحص الجانبية ===== */
        .drawer-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 50;
            opacity: 0; pointer-events: none;
            transition: opacity 0.4s;
        }
        .drawer-overlay.open { opacity: 1; pointer-events: auto; }

        .drawer-panel {
            position: fixed; top: 0; right: auto; left: 0; bottom: 0;
            width: min(640px, 92vw);
            background: #0f0f12;
            border-right: 1px solid rgba(245, 158, 11, 0.15);
            z-index: 51;
            transform: translateX(-100%);
            transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            overscroll-behavior: contain;
        }
        .drawer-panel.open { transform: translateX(0); }

        /* ===== لوحة الإعدادات ===== */
        .settings-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 60;
            opacity: 0; pointer-events: none;
            transition: opacity 0.4s;
        }
        .settings-overlay.open { opacity: 1; pointer-events: auto; }

        .settings-panel {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: min(520px, 92vw);
            background: #0f0f12;
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 20px;
            z-index: 61;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            max-height: 85vh; overflow-y: auto;
        }
        .settings-panel.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }

        /* ===== تقييم النجوم ===== */
        .star-rating { display: flex; gap: 6px; direction: ltr; }
        .star-btn {
            width: 36px; height: 36px; border-radius: 50%;
            border: 2px solid rgba(245, 158, 11, 0.3);
            background: transparent; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; color: rgba(245, 158, 11, 0.3);
            font-size: 1rem;
        }
        .star-btn.active {
            background: rgba(245, 158, 11, 0.2);
            border-color: #F59E0B;
            color: #F59E0B;
        }
        .star-btn:hover { border-color: #F59E0B; color: #F59E0B; }

        /* ===== شريط التقدم ===== */
        .mindset-meter-bg {
            width: 100%; height: 10px; border-radius: 999px;
            background: rgba(255,255,255,0.08);
            overflow: hidden;
        }
        .mindset-meter-fill {
            height: 100%; border-radius: 999px;
            transition: width 0.6s ease-out;
        }

        /* ===== تمييز العلامات ===== */
        .flag-green {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .flag-red {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* ===== شريط التمرير المخصص ===== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(245, 158, 11, 0.2); border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(245, 158, 11, 0.4); }

        /* ===== فلتر الأقسام ===== */
        .pill-btn {
            padding: 6px 16px; border-radius: 999px;
            border: 1px solid rgba(245, 158, 11, 0.15);
            background: transparent; color: #a1a1aa;
            cursor: pointer; transition: all 0.25s;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            font-size: 0.85rem; white-space: nowrap;
        }
        .pill-btn:hover { border-color: rgba(245, 158, 11, 0.4); color: #e4e4e7; }
        .pill-btn.active {
            background: rgba(245, 158, 11, 0.15);
            border-color: #F59E0B;
            color: #F59E0B;
        }

        /* ===== أيقونة الحالة ===== */
        .status-badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600;
        }

        /* ===== استجابة الموبايل ===== */
        @media (max-width: 768px) {
            .kpi-grid { grid-template-columns: repeat(2, 1fr) !important; }
            .cards-grid { grid-template-columns: 1fr !important; }
            .pin-input { width: 48px; height: 56px; font-size: 1.5rem; }
            .data-bar-actions { flex-wrap: wrap; }
        }
        @media (max-width: 480px) {
            .kpi-grid { grid-template-columns: 1fr !important; }
        }

        /* ===== انتقال ظهور ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }

        /* ===== إخفاء input file ===== */
        .file-input-hidden { display: none; }
    </style>
</head>
<body>
    <!-- تأثير إضاءة المؤشر -->
    <div id="cursor-glow"></div>

    <!-- ===== شاشة قفل PIN ===== -->
    <div id="pin-gate" class="fixed inset-0 z-[100] flex items-center justify-center" style="background: rgba(9,9,11,0.97); backdrop-filter: blur(30px);">
        <div class="glass-strong rounded-3xl p-10 max-w-md w-full mx-4 text-center fade-in-up">
            <!-- شعار -->
            <div class="w-16 h-16 mx-auto mb-6 rounded-2xl bg-gradient-to-br from-amber-500 to-amber-700 flex items-center justify-center">
                <svg class="w-8 h-8 text-obsidian" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </div>
            <h2 class="font-heading text-2xl font-bold text-white mb-2">لوحة الفرز والتقييم</h2>
            <p class="text-zinc-400 mb-8 text-sm">أدخل رمز PIN للدخول</p>

            <div id="pin-container" class="flex gap-3 justify-center mb-6" dir="ltr">
                <input type="password" maxlength="1" class="pin-input" data-idx="0" inputmode="numeric" autocomplete="off">
                <input type="password" maxlength="1" class="pin-input" data-idx="1" inputmode="numeric" autocomplete="off">
                <input type="password" maxlength="1" class="pin-input" data-idx="2" inputmode="numeric" autocomplete="off">
                <input type="password" maxlength="1" class="pin-input" data-idx="3" inputmode="numeric" autocomplete="off">
            </div>

            <p id="pin-error" class="text-red-400 text-sm mb-4 opacity-0 transition-opacity duration-300">رمز PIN غير صحيح</p>

            <button id="pin-submit" class="w-full py-3 rounded-xl bg-gradient-to-l from-amber-500 to-amber-600 text-obsidian font-heading font-bold text-lg hover:from-amber-400 hover:to-amber-500 transition-all duration-300 shadow-lg shadow-amber-500/20">
                دخول
            </button>
        </div>
    </div>

    <!-- ===== التطبيق الرئيسي ===== -->
    <div id="main-app" class="hidden relative z-10 min-h-screen">

        <!-- ===== الشريط العلوي ===== -->
        <header class="sticky top-0 z-40 glass-strong border-b border-amber-500/10">
            <div class="max-w-[1440px] mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
                <!-- الشعار والعنوان -->
                <div class="flex items-center gap-3 shrink-0">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-amber-700 flex items-center justify-center">
                        <svg class="w-5 h-5 text-obsidian" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                    </div>
                    <div>
                        <h1 class="font-heading font-bold text-white text-lg leading-tight">Gaber Group</h1>
                        <p class="text-amber-500/70 text-xs">لوحة فرز الفريق التأسيسي</p>
                    </div>
                </div>

                <!-- أزرار البيانات -->
                <div class="flex items-center gap-2 flex-wrap data-bar-actions">
                    <button onclick="generateDemoData()" class="px-3 py-2 rounded-lg glass text-xs font-medium text-amber-400 hover:bg-amber-500/10 transition-all flex items-center gap-1.5" title="تحميل بيانات تجريبية">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
                        <span class="hidden sm:inline">تحميل بيانات تجريبية</span>
                    </button>

                    <label class="px-3 py-2 rounded-lg glass text-xs font-medium text-blue-400 hover:bg-blue-500/10 transition-all flex items-center gap-1.5 cursor-pointer" title="استيراد JSON">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                        <span class="hidden sm:inline">استيراد JSON</span>
                        <input type="file" accept=".json" class="file-input-hidden" onchange="importJSON(event)">
                    </label>

                    <button onclick="exportJSON()" class="px-3 py-2 rounded-lg glass text-xs font-medium text-green-400 hover:bg-green-500/10 transition-all flex items-center gap-1.5" title="تصدير JSON">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                        <span class="hidden sm:inline">تصدير JSON</span>
                    </button>

                    <button onclick="exportCSV()" class="px-3 py-2 rounded-lg glass text-xs font-medium text-purple-400 hover:bg-purple-500/10 transition-all flex items-center gap-1.5" title="تصدير CSV">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                        <span class="hidden sm:inline">تصدير CSV</span>
                    </button>

                    <!-- زر الإعدادات -->
                    <button onclick="toggleSettings()" class="p-2 rounded-lg glass text-zinc-400 hover:text-amber-400 hover:bg-amber-500/10 transition-all" title="الإعدادات">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- ===== المحتوى الرئيسي ===== -->
        <main class="max-w-[1440px] mx-auto px-4 sm:px-6 py-6 space-y-6">

            <!-- ===== بطاقات KPI ===== -->
            <div class="kpi-grid grid grid-cols-5 gap-4" id="kpi-strip">
                <!-- يتم إنشاؤها ديناميكياً -->
            </div>

            <!-- ===== شريط الفلاتر ===== -->
            <div class="glass rounded-2xl p-4 space-y-4">
                <!-- البحث -->
                <div class="relative">
                    <svg class="absolute right-3 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <input id="search-input" type="text" placeholder="بحث بالاسم أو رقم الهاتف أو الكلية..." class="w-full pr-11 pl-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-zinc-500 focus:outline-none focus:border-amber-500/50 focus:ring-1 focus:ring-amber-500/20 transition-all text-sm" oninput="renderApplicants()">
                </div>

                <!-- فلتر المسار -->
                <div>
                    <p class="text-xs text-zinc-500 mb-2 font-medium">المسار</p>
                    <div class="flex flex-wrap gap-2" id="track-filters">
                        <button class="pill-btn active" data-track="all" onclick="setTrackFilter('all')">الكل</button>
                        <button class="pill-btn" data-track="Front-End" onclick="setTrackFilter('Front-End')">Front-End</button>
                        <button class="pill-btn" data-track="Back-End" onclick="setTrackFilter('Back-End')">Back-End</button>
                        <button class="pill-btn" data-track="UI/UX" onclick="setTrackFilter('UI/UX')">UI/UX</button>
                        <button class="pill-btn" data-track="AI Automation" onclick="setTrackFilter('AI Automation')">AI Automation</button>
                        <button class="pill-btn" data-track="Content Creator" onclick="setTrackFilter('Content Creator')">Content Creator</button>
                    </div>
                </div>

                <!-- فلتر مرحلة القبول -->
                <div>
                    <p class="text-xs text-zinc-500 mb-2 font-medium">مرحلة القبول</p>
                    <div class="flex flex-wrap gap-2" id="status-filters">
                        <button class="pill-btn active" data-status="all" onclick="setStatusFilter('all')">الكل</button>
                        <button class="pill-btn" data-status="pending" onclick="setStatusFilter('pending')">قيد المراجعة</button>
                        <button class="pill-btn" data-status="knockout" onclick="setStatusFilter('knockout')">مستبعد آلياً</button>
                        <button class="pill-btn" data-status="review" onclick="setStatusFilter('review')">مراجعة</button>
                        <button class="pill-btn" data-status="interview" onclick="setStatusFilter('interview')">مؤهل للمقابلة</button>
                        <button class="pill-btn" data-status="task" onclick="setStatusFilter('task')">مهمة تجريبية</button>
                        <button class="pill-btn" data-status="accepted" onclick="setStatusFilter('accepted')">مقبول نهائياً</button>
                        <button class="pill-btn" data-status="rejected" onclick="setStatusFilter('rejected')">مرفوض</button>
                    </div>
                </div>
            </div>

            <!-- ===== شبكة البطاقات ===== -->
            <div class="cards-grid grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="applicants-grid">
                <!-- يتم إنشاؤها ديناميكياً -->
            </div>

            <!-- رسالة فارغة -->
            <div id="empty-state" class="hidden text-center py-16">
                <svg class="w-16 h-16 mx-auto text-zinc-700 mb-4" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
                <h3 class="font-heading text-zinc-500 text-lg mb-2">لا يوجد متقدمين</h3>
                <p class="text-zinc-600 text-sm">قم بتحميل بيانات تجريبية أو استيراد ملف JSON</p>
            </div>
        </main>
    </div>

    <!-- ===== لوحة الفحص الجانبية ===== -->
    <div id="drawer-overlay" class="drawer-overlay" onclick="closeDrawer()"></div>
    <div id="drawer-panel" class="drawer-panel">
        <div id="drawer-content" class="p-6 space-y-6">
            <!-- يتم إنشاؤها ديناميكياً -->
        </div>
    </div>

    <!-- ===== لوحة الإعدادات ===== -->
    <div id="settings-overlay" class="settings-overlay" onclick="toggleSettings()"></div>
    <div id="settings-panel" class="settings-panel p-6 space-y-6">
        <div class="flex items-center justify-between mb-2">
            <h3 class="font-heading text-xl font-bold text-white">الإعدادات</h3>
            <button onclick="toggleSettings()" class="p-2 rounded-lg hover:bg-white/5 text-zinc-400 hover:text-white transition-colors">

    <!-- ===== جافاسكريبت ===== -->
    <script>
    // =====================================================

    let currentDrawerApplicantId = null;

    // =====================================================

    // =====================================================
    const scenarioQuestions = [

    // =====================================================
    // أسئلة المسارات
    // =====================================================
    const trackQuestions = {
        'Front-End': [
            'لو عندك صفحة بتحمّل بطيء جداً على موبايلات المستخدمين في مصر (إنترنت ضعيف)، إيه أول 3 حاجات هتعملها لتحسين الأداء؟',

            'كلاينت عايز ديزاين "مختلف ومبتكر" بس من غير تفاصيل واضحة. إزاي هتبدأ تشتغل؟',

            'إيه الفرق بين إنك تستخدم AI model جاهز (API) وإنك تدرّب موديل خاص؟ إمتى تختار كل واحد؟',

            'بوست اشتغلت عليه كتير منزلش زي ما توقعت. إيه أول حاجة هتعملها؟'
        ]
    };

    // =====================================================
    // كلمات محللة الوعي والعلامات
    // =====================================================
    const greenFlagKeywords = [
        'هبلّغ', 'هتواصل', 'أبلّغ', 'أوضح', 'مسؤولية', 'أتعلم', 'أطور', 'فيدباك',
        'بيانات', 'أرقام', 'تحليل', 'أعترف', 'أتقبل', 'هساعد', 'نتعاون', 'حل',
        'أسأل', 'أبحث', 'أفكر', 'خطة', 'أولويات', 'أفهم', 'نقاش', 'هادي',
        'أستمع', 'موضوعي', 'أحسن', 'أجرب', 'اختبار', 'تجربة',
        'هبلغ', 'ابلغ', 'ابلّغ', 'هتواصل'
    ];

    const redFlagKeywords = [
        'مش غلطتي', 'مش مسؤوليتي', 'هيزعل', 'أعصابي', 'هرد', 'مش فارق',
        'عادي', 'مفيش مشكلة', 'أسيبه', 'مش شغلي', 'أنا صح', 'غلط',
        'أرفض', 'هتجاهل', 'مش محتاج', 'أنا عارف', 'مش مهم', 'بلاش'
    ];

    // =====================================================
    // دوال المساعدة
    // =====================================================

    /** قراءة المتقدمين من localStorage */
    function getApplicants() {
        try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        } catch { return []; }
    }

    /** حفظ المتقدمين في localStorage */
    function saveApplicants(applicants) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(applicants));
    }

    /** الحصول على PIN المحفوظ */
    function getPin() {
        return localStorage.getItem(PIN_KEY) || DEFAULT_PIN;
    }

    /** الحصول على قالب واتساب */
    function getWATemplate() {
        return localStorage.getItem(WA_TEMPLATE_KEY) || DEFAULT_WA_TEMPLATE;
    }

    /** لون المسار */
    function trackColor(track) {
        const map = {
            'Front-End': { bg: 'rgba(59,130,246,0.15)', text: '#60a5fa', border: 'rgba(59,130,246,0.3)' },
            'Back-End': { bg: 'rgba(16,185,129,0.15)', text: '#34d399', border: 'rgba(16,185,129,0.3)' },
            'UI/UX': { bg: 'rgba(168,85,247,0.15)', text: '#c084fc', border: 'rgba(168,85,247,0.3)' },
            'AI Automation': { bg: 'rgba(245,158,11,0.15)', text: '#fbbf24', border: 'rgba(245,158,11,0.3)' },
            'Content Creator': { bg: 'rgba(236,72,153,0.15)', text: '#f472b6', border: 'rgba(236,72,153,0.3)' }
        };
        return map[track] || { bg: 'rgba(161,161,170,0.15)', text: '#a1a1aa', border: 'rgba(161,161,170,0.3)' };
    }

    /** لون الحالة */
    function statusInfo(status) {
        const map = {
            'pending': { label: 'قيد المراجعة', bg: 'rgba(250,204,21,0.12)', text: '#facc15', icon: '⏳' },
            'knockout': { label: 'مستبعد آلياً', bg: 'rgba(239,68,68,0.12)', text: '#f87171', icon: '🚫' },
            'review': { label: 'مراجعة', bg: 'rgba(96,165,250,0.12)', text: '#60a5fa', icon: '📋' },
            'interview': { label: 'مؤهل للمقابلة', bg: 'rgba(52,211,153,0.12)', text: '#34d399', icon: '🎙️' },
            'task': { label: 'مهمة تجريبية', bg: 'rgba(168,85,247,0.12)', text: '#c084fc', icon: '📝' },
            'accepted': { label: 'مقبول نهائياً', bg: 'rgba(34,197,94,0.12)', text: '#22c55e', icon: '✅' },
            'rejected': { label: 'مرفوض', bg: 'rgba(239,68,68,0.12)', text: '#ef4444', icon: '❌' }
        };
        return map[status] || { label: status, bg: 'rgba(161,161,170,0.12)', text: '#a1a1aa', icon: '❔' };
    }

    /** لون تقييم الوعي */
    function mindsetColor(score) {
        if (score > 70) return { bg: 'rgba(34,197,94,0.15)', text: '#4ade80' };
        if (score >= 40) return { bg: 'rgba(245,158,11,0.15)', text: '#fbbf24' };
        return { bg: 'rgba(239,68,68,0.15)', text: '#f87171' };
    }

    // =====================================================
    // محلل الوعي والعلامات الحمراء/الخضراء
    // =====================================================
    function analyzeMindset(applicant) {
        // جمع كل النصوص السلوكية
        const texts = [];
        const s1Why = applicant.scenario1Why || applicant.scenario1Reason;
        if (s1Why) texts.push(s1Why);
        if (applicant.scenario2) texts.push(applicant.scenario2);
        if (applicant.scenario3) texts.push(applicant.scenario3);
        if (applicant.scenario4) texts.push(applicant.scenario4);
        if (applicant.scenario5) texts.push(applicant.scenario5);
        const tAnsList = (applicant.trackAnswers && Array.isArray(applicant.trackAnswers) && applicant.trackAnswers.length)
            ? applicant.trackAnswers
            : [applicant.trackQ0, applicant.trackQ1, applicant.trackQ2].filter(Boolean);
        tAnsList.forEach(a => { if (a) texts.push(a); });
        const allText = texts.join(' ');

        // البحث عن العلامات
        const foundGreen = [];
        const foundRed = [];

        greenFlagKeywords.forEach(kw => {
            if (allText.includes(kw) && !foundGreen.includes(kw)) {
                foundGreen.push(kw);
            }
        });

        redFlagKeywords.forEach(kw => {
            if (allText.includes(kw) && !foundRed.includes(kw)) {
                foundRed.push(kw);
            }
        });

        // حساب النتيجة
        let score = 50;
        score += foundGreen.length * 5;
        score -= foundRed.length * 7;

        // تعديل بناء على اختيار السيناريو 1
        const s1 = String(applicant.scenario1Choice || applicant.scenario1 || '');
        if (s1.includes('هبلّغ') || s1.includes('أبلّغ') || s1 === 'choice1' || s1 === '1') {
            score += 15;
        } else if (s1.includes('هستنى') || s1.includes('أستنى') || s1 === 'choice3' || s1 === '3') {
            score -= 15;
        } else if (s1.includes('تاني') || s1.includes('أدّي') || s1 === 'choice4' || s1 === '4') {
            score -= 10;
        }

        // تقييد النتيجة
        score = Math.max(0, Math.min(100, score));

        // تحديث بيانات المتقدم
        applicant.mindsetScore = score;
        applicant.greenFlags = foundGreen;
        applicant.redFlags = foundRed;

        return applicant;
    }

    /** تشغيل المحلل على جميع المتقدمين */
    function analyzeAllApplicants() {
        const applicants = getApplicants();
        const analyzed = applicants.map(a => analyzeMindset(a));
        saveApplicants(analyzed);
        return analyzed;
    }

    // =====================================================
    // بطاقات KPI
    // =====================================================
    function renderKPIs() {
        const applicants = getApplicants();
        const total = applicants.length;
        const qualified = applicants.filter(a => a.status !== 'knockout').length;
        const knockout = applicants.filter(a => a.status === 'knockout').length;
        const interview = applicants.filter(a => a.status === 'interview').length;

        // متوسط التقييم
        const rated = applicants.filter(a => a.rubric && (a.rubric.commitment > 0 || a.rubric.maturity > 0 || a.rubric.trackMindset > 0));
        let avgScore = 0;
        if (rated.length > 0) {
            const sum = rated.reduce((acc, a) => {
                const r = a.rubric;
                return acc + (r.commitment + r.maturity + r.trackMindset) / 3;
            }, 0);
            avgScore = (sum / rated.length).toFixed(1);
        }

        const kpis = [
            { label: 'إجمالي المتقدمين', value: total, icon: '<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>', color: '#60a5fa' },
            { label: 'مؤهل للمراجعة', value: qualified, icon: '<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>', color: '#34d399' },
            { label: 'مستبعد آلياً', value: knockout, icon: '<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/></svg>', color: '#f87171' },
            { label: 'مؤهل للمقابلة', value: interview, icon: '<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>', color: '#a78bfa' },
            { label: 'متوسط التقييم', value: rated.length > 0 ? avgScore : '—', icon: '<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>', color: '#fbbf24' },
        ];

        document.getElementById('kpi-strip').innerHTML = kpis.map(k => `
            <div class="kpi-card glass rounded-2xl p-4 text-center">
                <div class="inline-flex items-center justify-center w-10 h-10 rounded-xl mb-3" style="background: ${k.color}15; color: ${k.color}">
                    ${k.icon}
                </div>
                <div class="text-2xl font-heading font-bold text-white">${k.value}</div>
                <div class="text-xs text-zinc-400 mt-1">${k.label}</div>
            </div>
        `).join('');
    }

    // =====================================================
    // شبكة بطاقات المتقدمين
    // =====================================================
    function renderApplicants() {
        const applicants = getApplicants();
        const searchVal = (document.getElementById('search-input')?.value || '').trim().toLowerCase();

        // تطبيق الفلاتر
        let filtered = applicants.filter(a => {
            // فلتر المسار
            if (currentTrackFilter !== 'all' && a.track !== currentTrackFilter) return false;
            // فلتر الحالة
            if (currentStatusFilter !== 'all' && a.status !== currentStatusFilter) return false;
            // فلتر البحث
            if (searchVal) {
                const haystack = [a.name, a.whatsapp, a.altPhone, a.faculty, a.email].filter(Boolean).join(' ').toLowerCase();
                if (!haystack.includes(searchVal)) return false;
            }
            return true;
        });

        const grid = document.getElementById('applicants-grid');
        const empty = document.getElementById('empty-state');

        if (filtered.length === 0) {
            grid.innerHTML = '';
            empty.classList.remove('hidden');
            return;
        }

        empty.classList.add('hidden');

        grid.innerHTML = filtered.map(a => {
            const tc = trackColor(a.track);
            const si = statusInfo(a.status);
            const mc = mindsetColor(a.mindsetScore || 0);

            return `
            <div class="applicant-card glass rounded-2xl p-5 cursor-pointer space-y-3" onclick="openDrawer('${a.id}')">
                <!-- الاسم والمسار -->
                <div class="flex items-start justify-between gap-2">
                    <div>
                        <h3 class="font-heading font-bold text-white text-base leading-tight">${a.name || '—'}</h3>
                        <p class="text-xs text-zinc-500 mt-0.5">${a.faculty || ''} ${a.academicYear ? '• ' + a.academicYear : ''}</p>
                    </div>
                    <span class="shrink-0 px-2.5 py-1 rounded-lg text-xs font-semibold" style="background:${tc.bg}; color:${tc.text}; border: 1px solid ${tc.border}">
                        ${a.track || '—'}
                    </span>
                </div>

                <!-- المحافظة -->
                <div class="flex items-center gap-1.5 text-zinc-400 text-xs">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    ${a.governorate || '—'}
                </div>

                <!-- الشارات السفلية -->
                <div class="flex items-center justify-between gap-2 pt-1">
                    <!-- تقييم الوعي -->
                    <span class="px-2.5 py-1 rounded-lg text-xs font-bold" style="background:${mc.bg}; color:${mc.text}">
                        ${a.mindsetScore != null ? a.mindsetScore + '%' : '—'}
                    </span>
                    <!-- الحالة -->
                    <span class="status-badge" style="background:${si.bg}; color:${si.text}">
                        ${si.icon} ${si.label}
                    </span>
                </div>

                <!-- زر التفاصيل -->
                <button class="w-full mt-2 py-2 rounded-xl bg-amber-500/10 text-amber-400 text-xs font-semibold hover:bg-amber-500/20 transition-all">
                    عرض التفاصيل
                </button>
            </div>
            `;
        }).join('');
    }

    // =====================================================
    // فلاتر
    // =====================================================
    function setTrackFilter(track) {
        currentTrackFilter = track;
        document.querySelectorAll('#track-filters .pill-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.track === track);
        });
        renderApplicants();
    }

    function setStatusFilter(status) {
        currentStatusFilter = status;
        document.querySelectorAll('#status-filters .pill-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.status === status);
        });
        renderApplicants();
    }

    // =====================================================
    // لوحة الفحص الجانبية
    // =====================================================

    // =====================================================
    // تقييم الروبريك
    // =====================================================
    function setRubric(id, criterion, value) {
        const applicants = getApplicants();
        const idx = applicants.findIndex(a => a.id === id);
        if (idx === -1) return;

        if (!applicants[idx].rubric) applicants[idx].rubric = { commitment: 0, maturity: 0, trackMindset: 0 };
        applicants[idx].rubric[criterion] = value;
        saveApplicants(applicants);

        // إعادة فتح اللوحة لتحديث العرض
        openDrawer(id);
        renderKPIs();
    }

    // =====================================================
    // حفظ ملاحظات المؤسس
    // =====================================================
    function saveFounderNotes(id) {
        const applicants = getApplicants();
        const idx = applicants.findIndex(a => a.id === id);
        if (idx === -1) return;

        applicants[idx].founderNotes = document.getElementById('founder-notes')?.value || '';
        saveApplicants(applicants);
    }

    // =====================================================
    // تغيير الحالة
    // =====================================================
    function changeStatus(id) {
        const applicants = getApplicants();
        const idx = applicants.findIndex(a => a.id === id);
        if (idx === -1) return;

        applicants[idx].status = document.getElementById('status-select')?.value || 'pending';
        saveApplicants(applicants);
        renderApplicants();
        renderKPIs();
    }

    // =====================================================
    // استيراد JSON
    // =====================================================
    function importJSON(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                let data = JSON.parse(e.target.result);
                // دعم ملف واحد أو مصفوفة
                if (!Array.isArray(data)) data = [data];

                const existing = getApplicants();
                const existingIds = new Set(existing.map(a => a.id));

                data.forEach(item => {
                    if (item.id && !existingIds.has(item.id)) {
                        existing.push(item);
                        existingIds.add(item.id);
                    } else if (item.id && existingIds.has(item.id)) {
                        // تحديث الموجود
                        const idx = existing.findIndex(a => a.id === item.id);
                        if (idx !== -1) existing[idx] = { ...existing[idx], ...item };
                    }
                });

                saveApplicants(existing);
                analyzeAllApplicants();
                refreshUI();
                showToast(`تم استيراد ${data.length} ملف بنجاح`);
            } catch (err) {
                showToast('خطأ في قراءة الملف: ' + err.message, 'error');
            }
        };
        reader.readAsText(file);
        event.target.value = ''; // إعادة تعيين
    }

    // =====================================================
    // تصدير JSON
    // =====================================================
    function exportJSON() {
        const applicants = getApplicants();
        if (applicants.length === 0) {
            showToast('لا يوجد بيانات للتصدير', 'error');
            return;
        }

        const blob = new Blob([JSON.stringify(applicants, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'gaber_applicants_backup.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('تم تصدير النسخة الاحتياطية');
    }

    // =====================================================
    // تصدير CSV
    // =====================================================
    function exportCSV() {
        const applicants = getApplicants();
        if (applicants.length === 0) {
            showToast('لا يوجد بيانات للتصدير', 'error');
            return;
        }

        const headers = ['ID', 'الاسم', 'المسار', 'الحالة', 'المحافظة', 'واتساب', 'البريد الإلكتروني', 'الكلية', 'السنة الدراسية', 'ساعات الإتاحة', 'تقييم الوعي', 'متوسط الروبريك'];

        const rows = applicants.map(a => {
            const r = a.rubric || { commitment: 0, maturity: 0, trackMindset: 0 };
            const rubricAvg = ((r.commitment + r.maturity + r.trackMindset) / 3).toFixed(1);
            const si = statusInfo(a.status);

            return [
                a.id || '',
                a.name || '',
                a.track || '',
                si.label,
                a.governorate || '',
                a.whatsapp || '',
                a.email || '',
                a.faculty || '',
                a.academicYear || '',
                a.hours || '',
                a.mindsetScore != null ? a.mindsetScore : '',
                rubricAvg
            ].map(field => `"${String(field).replace(/"/g, '""')}"`).join(',');
        });

        // إضافة BOM لدعم UTF-8 في Excel
        const bom = '\uFEFF';
        const csv = bom + headers.map(h => `"${h}"`).join(',') + '\n' + rows.join('\n');

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'gaber_applicants_export.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('تم تصدير ملف CSV');
    }

        const current = document.getElementById('settings-current-pin').value;
        const newPin = document.getElementById('settings-new-pin').value;
        const msg = document.getElementById('pin-change-msg');

        if (current !== getPin()) {
            msg.textContent = 'الرمز الحالي غير صحيح';
            msg.className = 'text-xs text-center text-red-400 opacity-100 transition-opacity';
            return;
        }

        if (newPin.length !== 4 || !/^\d{4}$/.test(newPin)) {
            msg.textContent = 'الرمز الجديد يجب أن يكون 4 أرقام';
            msg.className = 'text-xs text-center text-red-400 opacity-100 transition-opacity';
            return;
        }

        localStorage.setItem(PIN_KEY, newPin);
        msg.textContent = 'تم تحديث الرمز بنجاح ✓';
        msg.className = 'text-xs text-center text-green-400 opacity-100 transition-opacity';
        document.getElementById('settings-current-pin').value = '';
        document.getElementById('settings-new-pin').value = '';

        setTimeout(() => { msg.style.opacity = '0'; }, 3000);
    }

    function saveWATemplate() {
        const template = document.getElementById('settings-wa-template').value;
        localStorage.setItem(WA_TEMPLATE_KEY, template);
        showToast('تم حفظ قالب WhatsApp');
    }

    function clearAllData() {
        if (!confirm('هل أنت متأكد من مسح جميع البيانات؟ هذا الإجراء لا يمكن التراجع عنه.')) return;
        if (!confirm('تأكيد نهائي: سيتم حذف جميع المتقدمين والإعدادات. متأكد؟')) return;

        localStorage.removeItem(STORAGE_KEY);
        refreshUI();
        toggleSettings();
        showToast('تم مسح جميع البيانات', 'error');
    }

    // =====================================================
    // Toast / إشعار
    // =====================================================
    function showToast(message, type = 'success') {
        const existing = document.querySelector('.toast-notification');
        if (existing) existing.remove();

        const toast = document.createElement('div');
        toast.className = 'toast-notification fixed bottom-6 left-1/2 -translate-x-1/2 z-[200] px-6 py-3 rounded-xl font-medium text-sm shadow-2xl transition-all duration-500';
        toast.style.background = type === 'success' ? 'rgba(34,197,94,0.9)' : 'rgba(239,68,68,0.9)';
        toast.style.color = 'white';
        toast.style.backdropFilter = 'blur(16px)';
        toast.textContent = message;
        document.body.appendChild(toast);

        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translate(-50%, 20px)';
            setTimeout(() => toast.remove(), 500);
        }, 3000);
    }

    // =====================================================
    // تحديث الواجهة
    // =====================================================
    function refreshUI() {
        renderKPIs();
        renderApplicants();
    }

    // =====================================================
    // شاشة قفل PIN
    // =====================================================
    function initPinGate() {
        const inputs = document.querySelectorAll('.pin-input');

        inputs.forEach((input, idx) => {
            input.addEventListener('input', (e) => {
                const val = e.target.value;
                if (val.length === 1 && idx < 3) {
                    inputs[idx + 1].focus();
                }
                // محاولة التحقق عند ملء الأربعة
                if (idx === 3 && val.length === 1) {
                    setTimeout(verifyPin, 100);
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && idx > 0) {
                    inputs[idx - 1].focus();
                }
                if (e.key === 'Enter') {
                    verifyPin();
                }
            });

            // منع إدخال غير رقمي
            input.addEventListener('keypress', (e) => {
                if (!/\d/.test(e.key)) e.preventDefault();
            });
        });

        document.getElementById('pin-submit').addEventListener('click', verifyPin);

        // تركيز أول خانة
        setTimeout(() => inputs[0].focus(), 300);
    }

    function verifyPin() {
        const inputs = document.querySelectorAll('.pin-input');
        const entered = Array.from(inputs).map(i => i.value).join('');

        if (entered.length < 4) return;

        if (entered === getPin()) {
            // نجاح
            const gate = document.getElementById('pin-gate');
            gate.style.transition = 'opacity 0.5s, transform 0.5s';
            gate.style.opacity = '0';
            gate.style.transform = 'scale(1.05)';
            setTimeout(() => {
                gate.style.display = 'none';
                document.getElementById('main-app').classList.remove('hidden');
                // تشغيل المحلل عند التحميل
                analyzeAllApplicants();
                refreshUI();
            }, 500);
        } else {
            // فشل
            const container = document.getElementById('pin-container');
            const error = document.getElementById('pin-error');
            container.classList.add('shake');
            error.style.opacity = '1';

            setTimeout(() => {
                container.classList.remove('shake');
                inputs.forEach(i => i.value = '');
                inputs[0].focus();
            }, 600);

            setTimeout(() => { error.style.opacity = '0'; }, 3000);
        }
    }

    // =====================================================
    // تأثير إضاءة المؤشر
    // =====================================================
    function initCursorGlow() {
        const glow = document.getElementById('cursor-glow');
        let mouseX = 0, mouseY = 0;
        let glowX = 0, glowY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animate() {
            glowX += (mouseX - glowX) * 0.1;
            glowY += (mouseY - glowY) * 0.1;
            glow.style.left = glowX + 'px';
            glow.style.top = glowY + 'px';
            requestAnimationFrame(animate);
        }
        animate();

        // إخفاء عند خروج المؤشر
        document.addEventListener('mouseleave', () => { glow.style.opacity = '0'; });
        document.addEventListener('mouseenter', () => { glow.style.opacity = '1'; });
    }

    // =====================================================
    // مراقبة localStorage للتحديثات من تبويب آخر
    // =====================================================
    window.addEventListener('storage', (e) => {
        if (e.key === STORAGE_KEY) {
            refreshUI();
        }
    });

    // =====================================================
    // التهيئة
    // =====================================================
    document.addEventListener('DOMContentLoaded', () => {
        initCursorGlow();
        initPinGate();
    });
    </script>
</body>
</html>
